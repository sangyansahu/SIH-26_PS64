version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: aicte_portal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aicte_complaints
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aicte_complaints"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicte_portal_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@db:5432/aicte_complaints
      - SECRET_KEY=aicte-portal-prod-secret-key-2026
      - JWT_SECRET_KEY=aicte-portal-prod-jwt-secret-key-2026
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python seed.py && python run.py"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aicte_portal_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
